<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thron-Crown 的站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .card {
            text-align: center;
            padding: 40px 60px;
            border-radius: 16px;
            background-color: #1f2937;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 12px;
        }
        p {
            color: #d1d5db;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello Pages</h1>
        <p>欢迎来到 Thron-Crown 的静态演示网页</p>
        <p>这是 GitHub Pages 搭建的静态页面</p>
    </div>
</body>
</html>
